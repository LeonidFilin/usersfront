services:
  frontend:
    build:
      context: ./front/usersfront
    container_name: users_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./front/usersfront:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000/api
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  backend:
    build:
      context: ./web
    container_name: users_backend
    ports:
      - "5000:5000"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      PORT: 5000
      DB_NAME: mydb_dev
      DB_USER: postgres
      DB_PASS: postgres
      DB_HOST: postgres
      JWT_SECRET: supersecretkey
    command: sh -c "npx sequelize-cli db:migrate && npm run dev"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: users_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mydb_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: